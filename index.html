<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ИИ: 3D-технологии</title>
    <link rel="icon" type="image/svg+xml" href="TemplateData/ai-3d-favicon.svg">
    <link rel="preload" href="TemplateData/festival-loading.webp" as="image" type="image/webp" fetchpriority="high">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="preload" href="TemplateData/fonts/CeraRoundPro-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <noscript><div><img src="https://top-fwz1.mail.ru/counter?id=3269728;js=na" style="position:absolute;left:-9999px;" alt="Top.Mail.Ru" /></div></noscript>
</head>
<body>
<div class="game">
    <div id="unity-container">
        <canvas id="unity-canvas" width=960 height=540></canvas>
        <button id="unity-fullscreen-button"></button>
        <div id="loading-screen">
            <div id="bg-overlay" aria-hidden="true"></div>
            <div id="unity-loading-bar">
                <div class="loading-controls">
                    <div id="loading-label" role="status"><span class="sr-only">Загрузка...</span><span class="loading-wave" aria-hidden="true">Загрузка...</span></div>
                    <div id="unity-progress-bar-empty" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div id="unity-progress-bar-full"></div>
                    </div>
                    <button id="start-button" type="button">Вперёд за новыми знаниями!</button>
                </div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-build-title">Project Template</div>
        </div>
        <div id="orientation-blocker" role="dialog" aria-modal="true" aria-labelledby="orientation-title" aria-describedby="orientation-description" tabindex="-1" hidden>
            <div class="orientation-card">
                <div class="orientation-illustration" aria-hidden="true">
                    <svg class="orientation-arrow" viewBox="0 0 180 180"><path d="M35 65a60 60 0 0 1 110-8m-1-25 3 29-29-3" /></svg>
                    <div class="orientation-device"><span></span></div>
                </div>
                <h1 id="orientation-title">Поверните устройство</h1>
                <p id="orientation-description">Для прохождения тренажёра нужен горизонтальный экран.</p>
                <p class="orientation-hint">Игра на паузе. Продолжим после поворота.</p>
            </div>
        </div>
    </div>
</div>
<script>
    var html = document.querySelector("html");
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var startButton = document.querySelector("#start-button");
    var loadingLabel = document.querySelector("#loading-label");
    var loadingScreen = document.querySelector("#loading-screen");
    var loadingWave = document.querySelector(".loading-wave");
    var loadingLetters = Array.from(loadingWave.textContent, function(letter, index) {
        var span = document.createElement("span");
        span.textContent = letter;
        span.style.setProperty("--letter-index", index);
        return span;
    });
    loadingWave.replaceChildren(...loadingLetters);
    var playerLoadProgress = 0;
    var contentLoadProgress = 0;
    var contentReady = false;
    var orientationBlocker = document.querySelector("#orientation-blocker");
    var portraitQuery = window.matchMedia("(orientation: portrait)");
    var orientationPaused = false;
    var sentOrientationPaused = null;
    var focusBeforeOrientationPause = null;
    var gameStarted = false;

    function syncOrientationPause() {
        // Bootstrap belongs to the trainer scene, which may still be downloading.
        if (!MyGameInstance || !contentReady || sentOrientationPaused === orientationPaused) return;
        if (!orientationPaused && window.ucsberSetPlayerLoopPaused) window.ucsberSetPlayerLoopPaused(false);
        MyGameInstance.SendMessage("Bootstrap", "SetOrientationPaused", orientationPaused ? 1 : 0);
        sentOrientationPaused = orientationPaused;
        // Also stop unscaled Update/animations once gameplay has started. Loading remains active.
        if (gameStarted && orientationPaused && window.ucsberSetPlayerLoopPaused) window.ucsberSetPlayerLoopPaused(true);
    }

    function updateOrientation() {
        var paused = portraitQuery.matches;
        if (paused !== orientationPaused) {
            orientationPaused = paused;
            orientationBlocker.hidden = !paused;
            [canvas, loadingScreen, fullscreenButton].forEach(function(element) { element.inert = paused; });
            if (paused) {
                focusBeforeOrientationPause = document.activeElement;
                orientationBlocker.focus({ preventScroll: true });
            } else if (focusBeforeOrientationPause && focusBeforeOrientationPause.isConnected) {
                focusBeforeOrientationPause.focus({ preventScroll: true });
            }
        }
        syncOrientationPause();
    }

    // Unity can listen for keyboard events on the document, outside the canvas.
    ["keydown", "keyup", "keypress"].forEach(function(type) {
        window.addEventListener(type, function(event) {
            if (!orientationPaused) return;
            event.preventDefault();
            event.stopImmediatePropagation();
        }, true);
    });
    if (portraitQuery.addEventListener) portraitQuery.addEventListener("change", updateOrientation);
    else portraitQuery.addListener(updateOrientation);
    window.addEventListener("resize", updateOrientation);
    window.addEventListener("orientationchange", updateOrientation);
    document.addEventListener("fullscreenchange", updateOrientation);
    updateOrientation();

    function dismissLoadingScreen() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            loadingScreen.hidden = true;
            return;
        }
        var completed = false;
        var fallback;
        function finish() {
            if (completed) return;
            completed = true;
            clearTimeout(fallback);
            loadingScreen.removeEventListener("transitionend", onTransitionEnd);
            loadingScreen.hidden = true;
        }
        function onTransitionEnd(event) {
            if (event.target === loadingScreen && event.propertyName === "transform") finish();
        }
        loadingScreen.addEventListener("transitionend", onTransitionEnd);
        loadingScreen.classList.add("is-leaving");
        // Also finish if the browser interrupts or suppresses transition events.
        fallback = setTimeout(finish, 900);
    }

    function updateLoadingProgress() {
        var percent = Math.max(0, Math.min(100, 20 * playerLoadProgress + 80 * contentLoadProgress));
        progressBarFull.style.width = percent + "%";
        progressBarEmpty.setAttribute("aria-valuenow", Math.round(percent));
    }

    function showStartWhenReady() {
        if (!MyGameInstance || !contentReady) return;
        progressBarEmpty.style.display = "none";
        loadingLabel.textContent = "";
        loadingBar.classList.add("is-ready");
        startButton.style.display = "inline-block";
    }

    window.ucsberContentProgress = function(progress) {
        contentLoadProgress = Math.max(contentLoadProgress, Math.min(0.99, progress));
        updateLoadingProgress();
    };
    window.ucsberContentReady = function() {
        contentReady = true;
        contentLoadProgress = 1;
        updateLoadingProgress();
        sentOrientationPaused = null;
        syncOrientationPause();
        showStartWhenReady();
    };
    window.ucsberContentError = function() {
        unityShowBanner("Не удалось загрузить игру. Проверьте соединение и обновите страницу.", "error");
    };

    // Скрываем кнопку по умолчанию, она будет показана при необходимости после полной загрузки Unity
    fullscreenButton.style.display = 'none';
    fullscreenButton.style.visibility = 'hidden'; // Дополнительно скрываем через visibility

    var warningBanner = document.querySelector("#unity-warning");

    // Shows a temporary message banner/ribbon for a few seconds, or
    // a permanent error message on top of the canvas if type=='error'.
    // If type=='warning', a yellow highlight color is used.
    // Modify or remove this function to customize the visually presented
    // way that non-critical warnings and error messages are presented to the
    // user.
    function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
            if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
            setTimeout(function() {
                warningBanner.removeChild(div);
                updateBannerVisibility();
            }, 5000);
        }
        updateBannerVisibility();
    }

    function OpenCertificate(url) {
        window.location.href = url;
    }

    var params = new URLSearchParams(window.location.search);
    var session_id = params.get('session_id') ?? '';
    if (session_id != '')
    {
    }

    function SendEvent(action){
        console.log('event ' + action);
    }

    function SendEventWithParams(action, params){
        console.log('event with params ' + action);
        console.log(params);
    }

    function SendSimpleEvent(eventName){
        SendEvent(eventName);
    }

    function SendGameStartedEvent(game){
        var EventParams = {
            game: game
        };

        SendEventWithParams('game_started', EventParams);
    }

    function SendGameRestartEvent(game){
        var EventParams = {
            game: game
        };

        SendEventWithParams('game_restarted', EventParams);
    }

    function SendGameCompleteEvent(game, timeSpent){
        var EventParams = {
            game: game,
            time_spent: timeSpent
        };

        SendEventWithParams('game_complete', EventParams);
    }

    function SendHelpButtonEvent(game){
        var EventParams = {
            game: game
        };

        SendEventWithParams('help_button_clicked', EventParams);
    }



    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/1.1.2.loader.js";
    var config = {
        dataUrl: buildUrl + "/1.1.2.data",
        frameworkUrl: buildUrl + "/1.1.2.framework.js",
        codeUrl: buildUrl + "/1.1.2.wasm",
        cacheControl: function (url) {
            var path = url.split(/[?#]/, 1)[0];
            var filename = path.substring(path.lastIndexOf("/") + 1);
            // Content hashes change the URL on updates, so cached payloads
            // can be reused without a validation request to the CDN.
            if (/(?:^|_)[0-9a-f]{32}\.(?:bundle|data|wasm)(?:\.(?:br|gz|unityweb))?$/i.test(filename)) {
                return "immutable";
            }
            // Keep updates safe if hashed filenames are disabled later.
            if (/\.(?:bundle|data|wasm)(?:\.(?:br|gz|unityweb))?$/i.test(filename)) {
                return "must-revalidate";
            }
            // Catalogs and other mutable URLs must not use immutable storage.
            // Normal HTTP caching is still controlled by the server headers.
            return "no-store";
        },
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Sber",
        productName: "Project Template",
        productVersion: "1.0"
    };
    // By default Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        html.className = "mobile";
        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        //    unityShowBanner('Рекомендуется для прохождения на ПК.');
    } else {
        html.className = "desktop";
    }
    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    var MyGameInstance;
    script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
            playerLoadProgress = progress;
            updateLoadingProgress();
        }).then((unityInstance) => {
            // Сохраняем инстанс, скрываем прогресс-бар и показываем кнопку "Начать"
            MyGameInstance = unityInstance;
            syncOrientationPause();
            showStartWhenReady();

            // По клику запускаем игру: скрываем загрузчик и настраиваем фуллскрин
            startButton.onclick = () => {
                if (startButton.disabled || orientationPaused) return;
                startButton.disabled = true;
                gameStarted = true;
                dismissLoadingScreen();
                // Снимаем паузу в Unity (имя GO: Bootstrap, метод: Unpause)
                if (MyGameInstance) {
                    MyGameInstance.SendMessage("Bootstrap", "Unpause");

                    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

                    const isFullscreenSupported = !isIOS && (
                        document.fullscreenEnabled ||
                        document.webkitFullscreenEnabled ||
                        document.mozFullScreenEnabled ||
                        document.msFullscreenEnabled
                    );

                    if (isMobile && isFullscreenSupported) {
                        fullscreenButton.style.display = 'block';
                        fullscreenButton.style.visibility = 'visible';
                    } else {
                        fullscreenButton.style.display = 'none';
                        fullscreenButton.style.visibility = 'hidden';
                    }

                    fullscreenButton.onclick = () => {
                        if (MyGameInstance) {
                            // Keep the HTML blocker in the fullscreen tree alongside the canvas.
                            var requestFullscreen = container.requestFullscreen || container.webkitRequestFullscreen;
                            if (requestFullscreen) {
                                var request = requestFullscreen.call(container);
                                if (request && request.catch) request.catch(console.warn);
                            }
                        } else {
                            console.error("Unity instance not found!");
                        }
                    };
                }
            };
            
        }).catch((message) => {
            alert(message);
        });
    };
    document.body.appendChild(script);
    window.addEventListener("resize", function() {
        const canvas = document.getElementById("unity-canvas");
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
    });
</script>

</body>
</html>
